services:
    code-server:
        build: .
        image: java-dev-env

        ports:
            - "8080:8080"

        environment:
            - PASSWORD=dein-sicheres-passwort

        volumes:
            - ./project-data:/home/coder/project
            - /var/run/docker.sock:/var/run/docker.sock

        restart: unless-stopped