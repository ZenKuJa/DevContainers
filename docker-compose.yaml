services:
    code-server:
        build: .
        image: zenkuja/java-dev-container:latest

        ports:
            - "8080:8080"

        environment:
            - PASSWORD=dein-sicheres-passwort

        volumes:
            - ./project-data:/home/javaDev/project
            - /var/run/docker.sock:/var/run/docker.sock

        restart: unless-stopped